<script>
/* ============================
   GLOBAL STATE
   ============================ */
let xp = 0;
let completed = 0;
let playing = false;
let playTimer;
let lScore = 0;
let lDone = [false,false,false];
let micTimers = {};
let micStates = {};
let rqIndex = 0;
const synth = window.speechSynthesis;

/* ============================
   AUDIO CONTEXT FOR SOUNDS
   ============================ */
let audioCtx;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playBeep(freq,type,duration,vol,delay=0){
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);

    gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + delay + duration
    );

    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);

  }catch(e){}
}

function soundClick(){
  playBeep(800,'sine',0.08,0.3);
}

function soundCorrect(){
  playBeep(523,'sine',0.12,0.4);
  playBeep(659,'sine',0.12,0.4,0.13);
  playBeep(784,'sine',0.18,0.5,0.26);
}

function soundWrong(){
  playBeep(300,'sawtooth',0.12,0.35);
  playBeep(220,'sawtooth',0.15,0.35,0.13);
}

function soundComplete(){
  [523,587,659,698,784,880].forEach((f,i)=>{
    playBeep(f,'sine',0.15,0.45,i*0.1);
  });
}

function soundXP(){
  playBeep(880,'sine',0.1,0.4);
  playBeep(1047,'sine',0.12,0.5,0.12);
}

function soundClick2(){
  playBeep(600,'triangle',0.06,0.25);
}

/* ============================
   CLICK SOUND
   ============================ */
document.addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON') soundClick2();
});

/* ============================
   THEME
   ============================ */
function toggleTheme(){
  document.body.classList.toggle('light-mode');
}

/* ============================
   TABS
   ============================ */
function switchTab(id,btn){
  document.querySelectorAll('.section')
    .forEach(s=>s.classList.remove('active'));

  document.querySelectorAll('.tab-btn')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function switchSub(section,id,btn){

  const sec = document.getElementById(section);

  sec.querySelectorAll('.sub-section')
    .forEach(s=>s.classList.remove('active'));

  sec.querySelectorAll('.sub-tab-btn')
    .forEach(b=>b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

/* ============================
   XP & TOAST
   ============================ */
function showToast(msg){

  const t = document.getElementById('toast');

  t.textContent = msg;

  t.classList.add('show');

  soundXP();

  setTimeout(()=>{
    t.classList.remove('show');
  },2500);
}

function addXP(pts,msg){

  xp += pts;
  completed++;

  document.getElementById('dashXP').textContent = xp;
  document.getElementById('completedTasks').textContent = completed;

  updateLevel();

  showToast(msg);

  localStorage.setItem('yujujuXP',xp);
}

function updateLevel(){

  let lv='Beginner';

  if(xp>=100) lv='Intermediate';
  if(xp>=250) lv='Advanced';
  if(xp>=400) lv='Master';

  document.getElementById('levelBox').textContent=lv;
  document.getElementById('dashLevel').textContent=lv;
}

/* ============================
   SPEECH — HUMAN VOICE
   ============================ */
function speakText(text, speed = 0.82){

  synth.cancel();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = 'en-US';

  /* VOICE SETTINGS */
  u.rate = speed;
  u.pitch = 1;
  u.volume = 1;

  const voices = synth.getVoices();

  /* BEST NATURAL VOICES */
  const preferredVoices = [

    'Google US English',
    'Google UK English Female',

    'Microsoft Aria Online (Natural)',
    'Microsoft Jenny Online (Natural)',

    'Samantha',
    'Karen',
    'Daniel'
  ];

  let selectedVoice = null;

  preferredVoices.forEach(name=>{

    const found = voices.find(v=>v.name===name);

    if(found && !selectedVoice){
      selectedVoice = found;
    }
  });

  /* FALLBACK */
  if(!selectedVoice){

    selectedVoice =
      voices.find(v=>v.lang.includes('en-US')) ||

      voices.find(v=>v.lang.includes('en'));
  }

  if(selectedVoice){
    u.voice = selectedVoice;
  }

  /* SMOOTHER SPEECH */
  u.onstart = ()=>{
    console.log('Natural voice started...');
  };

  synth.speak(u);
}

/* ============================
   LISTENING — AUDIO QUIZ
   ============================ */
function togglePlay(){

  const text = `
  Hi! My name is Alex.
  Every day I wake up at 6:30 in the morning.

  First, I brush my teeth and take a shower.

  Then I eat breakfast,
  usually cereal and orange juice.

  After that,
  I go to school by bus.

  Classes start at 8 o'clock.

  In the afternoon,
  I do my homework and practice sports.

  At night,
  I read a book before I go to sleep at 10 PM.
  `;

  const btn=document.getElementById('playBtn');
  const wave=document.getElementById('audioWave');

  if(!playing){

    playing=true;

    btn.textContent='⏸';

    wave.classList.remove('paused');

    /* NATURAL SPEED */
    speakText(text,0.82);

    playTimer=setTimeout(()=>{

      playing=false;

      btn.textContent='▶️';

      wave.classList.add('paused');

    },18000);

  }else{

    playing=false;

    btn.textContent='▶️';

    wave.classList.add('paused');

    synth.cancel();

    clearTimeout(playTimer);
  }
}

/* ============================

function answerL3(btn,result){

  btn.classList.add(result);

/* ============================
   INIT
   ============================ */
window.onload=()=>{

  const saved = localStorage.getItem('yujujuXP');

  if(saved){

    xp=parseInt(saved);

    document.getElementById('dashXP').textContent=xp;

    updateLevel();
  }

  initDrag();

  /* LOAD VOICES */
  speechSynthesis.getVoices();

  if(speechSynthesis.onvoiceschanged !== undefined){
    speechSynthesis.onvoiceschanged = ()=>{
      speechSynthesis.getVoices();
    };
  }
};
</script>
